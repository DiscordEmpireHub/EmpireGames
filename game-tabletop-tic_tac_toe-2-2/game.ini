# ==============================================================================
# GAME SESSION CONFIGURATION SCRIPT AND METADATA (V2.3.0)
# Identification Pattern: prefix-platform-name-min_players-max_players
# ==============================================================================

[game-tabletop-tic_tac_toe-2-2]
; ------------------------------------------------------------------------------
; VERSION CONTROL AND COMPATIBILITY
; ------------------------------------------------------------------------------
manifest_version = 1.0.0
engine_version_required = >=0.1.0
config_last_updated = 2026-07-20T00:00:00Z

; ------------------------------------------------------------------------------
; BASIC IDENTIFICATION AND LOCALIZATION
; ------------------------------------------------------------------------------
id = game-tabletop-tic_tac_toe-2-2
name_en = Tic Tac Toe
name_pt_br = Jogo da Velha

; ------------------------------------------------------------------------------
; CLIENT/ENGINE INTEGRATION
; ------------------------------------------------------------------------------
requires_engine = false
client_entry_url = https://cdn.empirehub.com.br/games/tic-tac-toe/index.js
thumbnail_url = https://cdn.empirehub.com.br/games/tic-tac-toe/thumbnail.png

; ------------------------------------------------------------------------------
; RUNTIME DEPENDENCY MANAGEMENT
; ------------------------------------------------------------------------------
dependencies_shared_modules = core-sdk
dependencies_external_libraries = react@18.3.1,react-dom@18.3.1
dependencies_styles = tic-tac-toe.css

; ------------------------------------------------------------------------------
; NETWORK ARCHITECTURE AND PERSISTENCE
; ------------------------------------------------------------------------------
platform = tabletop
genre = abstract-strategy
network_architecture = authoritative-server
sync_mode = full-state
save_state_supported = false

; ------------------------------------------------------------------------------
; MATCHMAKING AND SESSION PARAMETERS
; ------------------------------------------------------------------------------
min_players = 2
max_players = 2
recommended_players = 2
allow_spectators = true
max_spectators = 20
ranked_matchmaking_enabled = false

; ------------------------------------------------------------------------------
; USER INTERFACE METADATA WITH HTML TAG SUPPORT (UI/UX)
; ------------------------------------------------------------------------------
description_en = Classic 2-player grid game. Be the first to align three marks in a row, column, or diagonal.
description_pt_br = Jogo clássico para 2 jogadores. Seja o primeiro a alinhar três marcas em linha, coluna ou diagonal.
ui_layout_preset = centered-board
theme_variant = default

; ------------------------------------------------------------------------------
; RULES ENGINE AND GAME STATE MACHINE
; ------------------------------------------------------------------------------
turn_based = true
has_ai_opponents = false
turn_timeout_seconds = 30
win_condition_type = three_in_a_row
tie_breaker_rules = false

; ------------------------------------------------------------------------------
; ASSETS AND AUDIO MANAGEMENT
; ------------------------------------------------------------------------------
assets_required = none
audio_bank_id = none
